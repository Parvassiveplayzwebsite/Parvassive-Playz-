<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parvassive Playz | Secure Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Science Gothic (Light 300), Rajdhani for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@300;400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #000000;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Science Gothic', sans-serif;
            font-weight: 300;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
        }

        /* --- STAGGERED ENTRANCE & FLOATING --- */
        @keyframes revealAndFloat {
            0% { opacity: 0; transform: translateY(30px); }
            40% { opacity: 1; transform: translateY(0px); }
            70% { transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0px); }
        }

        @keyframes continuousFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .entrance-anim {
            opacity: 0;
            animation: revealAndFloat 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .float-layer {
            animation: continuousFloat 4s ease-in-out infinite;
            animation-delay: 1.2s;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        /* --- BRANDING & DEEP GLOW --- */
        .top-brand {
            font-weight: 400;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .logo-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 25px;
        }

        .logo-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            z-index: 1;
        }

        .logo-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #000;
            object-fit: cover;
            z-index: 2;
        }

        .hero-title {
            text-align: center;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-main {
            display: block;
            font-weight: 300;
            font-size: 36px;
            color: white;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .hero-sub {
            display: block;
            font-weight: 300;
            font-size: 36px;
            color: var(--neon-cyan);
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.8), 0 0 30px rgba(0, 243, 255, 0.4);
        }

        .tagline-grey { color: #555; font-size: 11px; margin-bottom: 8px; letter-spacing: 0.5px; }
        .tagline-purple { color: #d946ef; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 40px; }

        /* --- BUTTONS & GLOW --- */
        .btn-join {
            width: 100%; max-width: 320px; padding: 17px;
            background: linear-gradient(90deg, #bc13fe, #00f3ff);
            border-radius: 10px; color: white; font-weight: 700; font-size: 16px;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), 0 0 30px rgba(188, 19, 254, 0.2);
            transition: all 0.3s ease;
        }
        
        .btn-join:active { transform: scale(0.96); }

        .btn-sub {
            width: 100%; max-width: 320px; padding: 15px;
            background: black; border: 2px solid var(--neon-cyan);
            border-radius: 10px; color: var(--neon-cyan); font-weight: 700; font-size: 16px;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 22px;
            position: relative; transition: all 0.3s ease;
        }

        .btn-sub::after {
            content: ""; position: absolute; inset: 3px;
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 6px;
        }

        .login-link {
            color: #444; font-size: 9px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; text-decoration: underline; text-underline-offset: 5px;
            cursor: pointer; transition: color 0.3s;
        }

        /* --- MODALS & TRANSITIONS --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.98);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px; font-family: 'Rajdhani', sans-serif;
            backdrop-filter: blur(15px);
        }

        .auth-card {
            background: white; width: 100%; max-width: 360px;
            padding: 35px 25px; border-radius: 30px; text-align: center; color: black;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15);
        }

        @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0px); } }
        @keyframes modalOut { from { opacity: 1; transform: scale(1) translateY(0px); } to { opacity: 0; transform: scale(0.9) translateY(-20px); } }

        .modal-active { animation: modalIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .modal-exit { animation: modalOut 0.4s ease-in forwards; }

        .google-btn {
            background: white; border: 1px solid #ddd; border-radius: 100px;
            padding: 12px; width: 100%; display: flex; align-items: center;
            justify-content: center; gap: 12px; font-weight: 600; font-size: 15px;
            margin-bottom: 25px; font-family: 'Rajdhani', sans-serif;
        }

        .input-grey {
            background: #f4f4f4; border-radius: 12px; padding: 14px 18px;
            margin-bottom: 12px; text-align: left; border: 1px solid transparent;
        }
        .input-grey:focus-within { border-color: var(--neon-cyan); background: #fff; }

        .input-grey label { display: block; font-size: 9px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 3px; }
        .input-grey input { background: transparent; border: none; width: 100%; outline: none; font-size: 16px; font-weight: 600; font-family: 'Rajdhani', sans-serif; }

        .btn-black-action {
            background: #000; color: #fff; width: 100%; padding: 16px;
            border-radius: 100px; font-weight: 700; font-size: 16px;
            font-family: 'Rajdhani', sans-serif; text-transform: uppercase;
        }

        .hidden { display: none !important; }
        
        #loader {
            position: fixed; inset: 0; background: black; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="w-8 h-8 border-4 border-cyan-500/10 border-t-cyan-500 rounded-full animate-spin"></div>
    </div>

    <!-- MAIN LANDING -->
    <div class="top-brand entrance-anim">
        <span>PARVASSIVE</span> <span class="text-cyan-400">PLAYZ</span>
    </div>

    <div class="logo-container entrance-anim delay-1">
        <div class="float-layer">
            <div class="logo-ring"></div>
            <img src="logo.jpg" class="logo-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=parvassive'">
        </div>
    </div>

    <div class="hero-title entrance-anim delay-1">
        <div class="float-layer">
            <span class="hero-main">PARVASSIVE</span>
            <span class="hero-sub">PLAYZ</span>
        </div>
    </div>

    <div class="text-center mb-10 px-10 entrance-anim delay-2">
        <p class="tagline-grey">High-octane gameplay, epic fails,<br>and community vibes.</p>
        <p class="tagline-purple italic">Not a Gamer, But a Game Changer.</p>
    </div>

    <div class="w-full px-10 flex flex-col items-center entrance-anim delay-3">
        <button onclick="openModal('signup-modal')" class="btn-join">JOIN SQUAD</button>
        <button onclick="window.open('https://youtube.com/@parvassiveplayz26?si=XCHfSm_ch-34Oxid', '_blank')" class="btn-sub">SUBSCRIBE NOW</button>
        <div onclick="openModal('login-modal')" class="login-link">ALREADY A MEMBER? LOGIN</div>
    </div>

    <!-- SIGN UP MODAL -->
    <div id="signup-modal" class="modal-overlay hidden">
        <div class="auth-card" id="signup-card">
            <h2 class="font-bold text-xl mb-6">CREATE ACCOUNT</h2>
            <!-- INTEGRATED SVG GOOGLE LOGO -->
            <button onclick="handleGoogle()" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
            <div class="divider text-gray-300 text-xs mb-6 text-center">or</div>
            <form id="signup-form">
                <div class="input-grey"><label>GAMER NAME</label><input type="text" id="s-name" required placeholder="NICKNAME"></div>
                <div class="input-grey"><label>EMAIL</label><input type="email" id="s-email" required placeholder="NAME@EMAIL.COM"></div>
                <div class="input-grey"><label>PASSWORD</label><input type="password" id="s-pass" required placeholder="••••••••"></div>
                <button type="submit" class="btn-black-action">Sign Up</button>
            </form>
            <span class="block mt-6 text-blue-500 font-bold cursor-pointer text-sm" onclick="transitionModal('signup-modal', 'login-modal')">Already a member? Login</span>
            <button onclick="closeModal('signup-modal')" class="mt-5 text-[10px] text-gray-400 font-bold uppercase tracking-widest">Close</button>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="auth-card" id="login-card">
            <h2 class="font-bold text-xl mb-6">SQUAD LOGIN</h2>
            <!-- INTEGRATED SVG GOOGLE LOGO -->
            <button onclick="handleGoogle()" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
            <div class="divider text-gray-300 text-xs mb-6 text-center">or</div>
            <form id="login-form">
                <div class="input-grey"><label>EMAIL</label><input type="email" id="l-email" required placeholder="NAME@EMAIL.COM"></div>
                <div class="input-grey"><label>PASSWORD</label><input type="password" id="l-pass" required placeholder="••••••••"></div>
                <button type="submit" class="btn-black-action">Login</button>
            </form>
            <span class="block mt-6 text-blue-500 font-bold cursor-pointer text-sm" onclick="transitionModal('login-modal', 'signup-modal')">New player? Join Squad</span>
            <button onclick="closeModal('login-modal')" class="mt-5 text-[10px] text-gray-400 font-bold uppercase tracking-widest">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpH9pjBZDgSFKXzVnddIUgtYzswWggijw",
            authDomain: "parvassive-squad-deb49.firebaseapp.com",
            projectId: "parvassive-squad-deb49",
            storageBucket: "parvassive-squad-deb49.firebasestorage.app",
            messagingSenderId: "66622523570",
            appId: "1:66622523570:web:c5990de0eab030a9961ab"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.openModal = (id) => {
            const modal = document.getElementById(id);
            const card = modal.querySelector('.auth-card');
            modal.classList.remove('hidden');
            card.classList.remove('modal-exit');
            card.classList.add('modal-active');
        };

        window.closeModal = (id) => {
            const modal = document.getElementById(id);
            const card = modal.querySelector('.auth-card');
            card.classList.remove('modal-active');
            card.classList.add('modal-exit');
            setTimeout(() => modal.classList.add('hidden'), 400);
        };

        window.transitionModal = (oldId, newId) => {
            const oldModal = document.getElementById(oldId);
            const oldCard = oldModal.querySelector('.auth-card');
            oldCard.classList.add('modal-exit');
            setTimeout(() => {
                oldModal.classList.add('hidden');
                openModal(newId);
            }, 400);
        };

        window.handleGoogle = () => {
            document.getElementById('loader').classList.remove('hidden');
            signInWithRedirect(auth, provider);
        };

        document.getElementById('signup-form').onsubmit = async (e) => {
            e.preventDefault();
            document.getElementById('loader').classList.remove('hidden');
            try {
                const name = document.getElementById('s-name').value;
                const email = document.getElementById('s-email').value;
                const pass = document.getElementById('s-pass').value;
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: name });
                await setDoc(doc(db, "users", res.user.uid), { uid: res.user.uid, name, email, joinedAt: new Date() }, { merge: true });
                window.location.href = "dashboard.html";
            } catch (err) { alert(err.message); document.getElementById('loader').classList.add('hidden'); }
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            document.getElementById('loader').classList.remove('hidden');
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('l-email').value, document.getElementById('l-pass').value);
                window.location.href = "dashboard.html";
            } catch (err) { alert(err.message); document.getElementById('loader').classList.add('hidden'); }
        };

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loader').classList.add('hidden');
        });

        window.onload = () => {
            getRedirectResult(auth).then((result) => {
                if (result) window.location.href = "dashboard.html";
            }).catch(e => { console.error(e); document.getElementById('loader').classList.add('hidden'); });
        };
    </script>
</body>
</html>
