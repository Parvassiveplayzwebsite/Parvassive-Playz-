<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parvassive Playz | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Light background to match Image 2 context */
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* THE WHITE CARD FROM YOUR IMAGE 2 */
        .auth-container {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 40px 24px;
            text-align: center;
        }

        /* Exact Google Button Style from Image 2 */
        .btn-google {
            background: white;
            color: #000;
            border: 2px dashed #000; /* Matching the dashed border in your reference */
            border-radius: 12px;
            width: 100%;
            padding: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .divider {
            color: #666;
            margin: 20px 0;
            font-size: 16px;
        }

        /* Email Input Style from Image 2 */
        .input-box {
            background: #ededed;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
        }
        .input-box label {
            display: block;
            color: #000;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .input-box input {
            background: transparent;
            border: none;
            width: 100%;
            outline: none;
            font-size: 16px;
        }

        /* The Black Button from Image 2 */
        .btn-black {
            background: #000;
            color: #fff;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            border: none;
            cursor: pointer;
        }

        /* Loading Screen Fix */
        #loader {
            position: fixed;
            inset: 0;
            background: #0a0a0c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #00f3ff;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top: 4px solid #00f3ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { display: none !important; }
        
        /* Cyberpunk Dashboard (Visible after login) */
        #dashboard {
            background: #000;
            color: #00f3ff;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #00f3ff;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- STUCK SCREEN FIX: This will be hidden by script -->
    <div id="loader">
        <div class="spinner mb-4"></div>
        <p style="letter-spacing: 2px; font-size: 12px;">LOADING GRID...</p>
    </div>

    <!-- UI From Image 2 -->
    <div id="login-ui" class="auth-container hidden">
        <button id="google-btn" class="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_spaces_64dp.png" width="20" alt="G">
            Continue with Google
        </button>

        <div class="divider">or</div>

        <form id="auth-form">
            <div class="input-box">
                <label>EMAIL</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-box" id="pass-box">
                <label>PASSWORD</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-black" id="submit-btn">Continue with email</button>
        </form>
        
        <p class="mt-6 text-gray-500 text-sm">
            Need an account? <span id="toggle-auth" class="text-blue-600 font-bold cursor-pointer">Sign Up</span>
        </p>
    </div>

    <!-- Post-Login Dashboard -->
    <div id="dashboard" class="hidden">
        <img id="u-img" src="" class="w-20 h-20 rounded-full mx-auto border-2 border-cyan-400 mb-4">
        <h2 class="text-xl font-bold" id="u-name">COMMANDER</h2>
        <p id="u-email" class="text-sm opacity-70 mb-6"></p>
        <button onclick="logout()" class="text-red-500 font-bold text-xs tracking-widest border border-red-500 px-4 py-2 rounded">LOGOUT</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithRedirect, 
            getRedirectResult, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Verified keys from your screenshot
        const firebaseConfig = {
            apiKey: "AIzaSyCpH9pjBZDgSFKXzVnddIUgtYzswWggijw",
            authDomain: "parvassive-squad-deb49.firebaseapp.com",
            projectId: "parvassive-squad-deb49",
            storageBucket: "parvassive-squad-deb49.firebasestorage.app",
            messagingSenderId: "66622523570",
            appId: "1:66622523570:web:c5990de0eab030a9961ab"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loader = document.getElementById('loader');
        const loginUi = document.getElementById('login-ui');
        const dashUi = document.getElementById('dashboard');

        let isSignUp = false;

        // Force hide loader after 5 seconds if Firebase hangs
        setTimeout(() => {
            if(!loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
                loginUi.classList.remove('hidden');
                console.warn("Firebase took too long. Check your domain whitelisting.");
            }
        }, 5000);

        // Google Login
        document.getElementById('google-btn').onclick = () => {
            loader.classList.remove('hidden');
            signInWithRedirect(auth, provider);
        };

        // Email Auth
        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if(isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        };

        // Toggle UI
        document.getElementById('toggle-auth').onclick = () => {
            isSignUp = !isSignUp;
            document.getElementById('submit-btn').innerText = isSignUp ? "Create Account" : "Continue with email";
            document.getElementById('toggle-auth').innerText = isSignUp ? "Login instead" : "Sign Up";
        };

        // Handle Redirect (When coming back from Google)
        window.onload = async () => {
            try {
                const result = await getRedirectResult(auth);
                if (result) console.log("User logged in");
            } catch (error) {
                // If it fails here, it's likely a "Domain Not Authorized" error
                if(error.code === "auth/unauthorized-domain") {
                    alert("CRITICAL ERROR: This website domain is not allowed in Firebase. Add your current URL to 'Authorized Domains' in Firebase Settings.");
                } else {
                    alert("Auth Error: " + error.message);
                }
                loader.classList.add('hidden');
                loginUi.classList.remove('hidden');
            }
        };

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {
            loader.classList.add('hidden');
            if (user) {
                loginUi.classList.add('hidden');
                dashUi.classList.remove('hidden');
                document.getElementById('u-name').innerText = user.displayName || "PARVASSIVE GAMER";
                document.getElementById('u-email').innerText = user.email;
                document.getElementById('u-img').src = user.photoURL || `https://api.dicebear.com/7.x/pixel-art/svg?seed=${user.uid}`;
            } else {
                loginUi.classList.remove('hidden');
                dashUi.classList.add('hidden');
            }
        });

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
