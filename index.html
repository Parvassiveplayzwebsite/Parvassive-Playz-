<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parvassive Playz | Secure Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #0a0a0c;
        }

        body {
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease;
        }

        .auth-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            text-align: center;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }

        .btn-google {
            background: white;
            color: #000;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            width: 100%;
            padding: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 16px;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #9ca3af;
            margin: 24px 0;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #f3f4f6; }
        .divider:not(:empty)::before { margin-right: 12px; }
        .divider:not(:empty)::after { margin-left: 12px; }

        .input-group {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 12px 16px;
            text-align: left;
            margin-bottom: 12px;
            border: 2px solid transparent;
        }
        .input-group:focus-within { border-color: var(--neon-cyan); background: white; }

        .input-group label {
            display: block;
            color: #6b7280;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 2px;
        }
        .input-group input {
            background: transparent;
            border: none;
            width: 100%;
            outline: none;
            font-size: 15px;
            color: #000;
        }

        .btn-main {
            background: #000;
            color: #fff;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-weight: 700;
            margin-top: 10px;
        }

        #dashboard {
            background: var(--dark-bg);
            color: white;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--neon-cyan);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .hidden { display: none !important; }
        
        #loader {
            position: fixed;
            inset: 0;
            background: #0a0a0c;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Professional Loader -->
    <div id="loader">
        <div class="w-10 h-10 border-4 border-cyan-500/20 border-t-cyan-500 rounded-full animate-spin mb-4"></div>
        <p class="text-cyan-400 font-mono text-[10px] tracking-[0.3em]">SYNCHRONIZING BACKBONE</p>
    </div>

    <!-- Auth UI -->
    <div id="auth-ui" class="auth-card hidden">
        <div class="mb-8">
            <h1 class="text-2xl font-black italic text-black uppercase tracking-tighter">
                PARVASSIVE<span class="text-cyan-500">PLAYZ</span>
            </h1>
            <p id="auth-subtitle" class="text-gray-400 text-[11px] mt-1 font-bold uppercase tracking-widest">Entry Protocol Required</p>
        </div>

        <button id="google-btn" class="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_google_spaces_64dp.png" width="18">
            Continue with Google
        </button>

        <div class="divider">OR USE BACKBONE</div>

        <form id="auth-form">
            <div id="name-field-container" class="input-group hidden">
                <label>GAMER NAME</label>
                <input type="text" id="reg-name" placeholder="Enter Nickname">
            </div>
            <div class="input-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="auth-email" required placeholder="commander@playz.com">
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="auth-pass" required placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn" class="btn-main">CONTINUE</button>
        </form>
        
        <p class="mt-8 text-gray-400 text-xs font-medium">
            <span id="toggle-msg">New to the squad?</span>
            <span id="toggle-btn" class="text-cyan-600 font-bold cursor-pointer ml-1 underline">Sign Up</span>
        </p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <div class="relative inline-block mb-6">
            <img id="u-img" src="" class="w-24 h-24 rounded-full border-2 border-cyan-400 p-1 shadow-[0_0_20px_rgba(0,243,255,0.4)]">
            <div class="absolute bottom-1 right-1 w-5 h-5 bg-green-500 border-4 border-black rounded-full"></div>
        </div>
        <h2 class="text-3xl font-black italic tracking-tighter uppercase" id="u-name">PLAYER</h2>
        <p id="u-email" class="text-cyan-400 font-mono text-[10px] mb-8 opacity-60 tracking-wider"></p>
        
        <div class="bg-white/5 border border-white/10 rounded-2xl p-5 mb-8 text-left">
            <div class="flex justify-between items-center mb-3">
                <span class="text-gray-500 text-[9px] font-black uppercase tracking-widest">Auth Method</span>
                <span id="auth-method-label" class="text-[9px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded font-bold">--</span>
            </div>
            <p class="text-[13px] text-gray-400 leading-relaxed">Account verified. Access to the Parvassive Playz gamer hub is now active.</p>
        </div>

        <button onclick="handleLogout()" class="w-full py-4 text-red-500 font-bold text-[10px] tracking-[0.2em] border border-red-500/20 hover:bg-red-500/5 rounded-xl transition-all uppercase">
            Terminate Session
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, 
            onAuthStateChanged, signOut, signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Using your verified keys from project: parvassive-squad-deb49
        const firebaseConfig = {
            apiKey: "AIzaSyCpH9pjBZDgSFKXzVnddIUgtYzswWggijw",
            authDomain: "parvassive-squad-deb49.firebaseapp.com",
            projectId: "parvassive-squad-deb49",
            storageBucket: "parvassive-squad-deb49.firebasestorage.app",
            messagingSenderId: "66622523570",
            appId: "1:66622523570:web:c5990de0eab030a9961ab"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loader = document.getElementById('loader');
        const authUi = document.getElementById('auth-ui');
        const dashUi = document.getElementById('dashboard');

        let isSignUp = false;

        // UI Toggle (Login vs Sign Up)
        document.getElementById('toggle-btn').onclick = () => {
            isSignUp = !isSignUp;
            document.getElementById('name-field-container').classList.toggle('hidden');
            document.getElementById('submit-btn').innerText = isSignUp ? "CREATE HUB ACCOUNT" : "CONTINUE";
            document.getElementById('toggle-msg').innerText = isSignUp ? "Already a squad member?" : "New to the squad?";
            document.getElementById('toggle-btn').innerText = isSignUp ? "Log In" : "Sign Up";
            document.getElementById('auth-subtitle').innerText = isSignUp ? "Initialize Profile" : "Entry Protocol Required";
        };

        // Google Authentication
        document.getElementById('google-btn').onclick = () => {
            loader.classList.remove('hidden');
            signInWithRedirect(auth, provider);
        };

        // Email Authentication (The Backbone)
        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            loader.classList.remove('hidden');
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const name = document.getElementById('reg-name').value;

            try {
                if (isSignUp) {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await updateProfile(res.user, { displayName: name });
                    await syncUser(res.user, "EMAIL");
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (err) {
                alert("ACCESS DENIED: " + err.message);
                loader.classList.add('hidden');
            }
        };

        // Firestore User Sync
        async function syncUser(user, method) {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    displayName: user.displayName || "Gamer",
                    email: user.email,
                    photoURL: user.photoURL || "",
                    authMethod: method,
                    timestamp: new Date()
                });
            }
        }

        // Global Auth State Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const method = user.providerData[0]?.providerId === 'google.com' ? 'GOOGLE' : 'EMAIL';
                await syncUser(user, method);
                
                document.getElementById('u-name').innerText = user.displayName || "COMMANDER";
                document.getElementById('u-email').innerText = user.email.toUpperCase();
                document.getElementById('u-img').src = user.photoURL || `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${user.uid}`;
                document.getElementById('auth-method-label').innerText = method;
                
                authUi.classList.add('hidden');
                dashUi.classList.remove('hidden');
                document.body.style.backgroundColor = "#0a0a0c";
            } else {
                authUi.classList.remove('hidden');
                dashUi.classList.add('hidden');
                document.body.style.backgroundColor = "#f3f4f6";
            }
            loader.classList.add('hidden');
        });

        window.handleLogout = () => {
            loader.classList.remove('hidden');
            signOut(auth);
        };

        // Handle return from Google
        window.onload = () => getRedirectResult(auth).catch(e => console.error("Redirect Error:", e));
    </script>
</body>
</html>
